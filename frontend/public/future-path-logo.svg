<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fp-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="fp-grad-path" x1="12" y1="38" x2="36" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="fp-grad-star" x1="30" y1="8" x2="40" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="fp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Brand Gradient -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#fp-grad-primary)" filter="url(#fp-glow)" />

  <!-- Education Cornerstone / Academic Arch (Subtle Geometry) -->
  <path d="M10 34C13 31 18 29 24 29C30 29 35 31 38 34" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Graduation / Knowledge Foundation Base -->
  <path d="M14 36L24 31L34 36L24 41L14 36Z" fill="rgba(255, 255, 255, 0.16)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- The Ascending Career Pathway / Forward Road -->
  <path d="M17 38C19 28 22 22 28 17C31 14.5 33 13 35 12" stroke="url(#fp-grad-path)" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Dashed Guidance Horizon Line -->
  <path d="M21 37C23 29 25 24 30 19" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.9" />

  <!-- Future Opportunities / North Star Sparkle -->
  <g transform="translate(35, 12)">
    <path d="M0 -6L1.6 -1.6L6 0L1.6 1.6L0 6L-1.6 1.6L-6 0L-1.6 -1.6Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Direction Vector / Arrow Spark -->
  <circle cx="21" cy="27" r="1.8" fill="#06B6D4" />
  <circle cx="26" cy="21" r="1.8" fill="#38BDF8" />
</svg>
